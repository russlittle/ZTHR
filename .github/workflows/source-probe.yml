name: Resource source probe

# Checks which public sources of community resources answer from here, and what each returns for an area.
# On demand only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Probe
        shell: bash
        run: |
          set +e +o pipefail
          UA='zthr-resource-finder (+https://zthr.ai)'
          get() { curl -sS -L -A "$UA" -m 120 -o "$2" -w '%{http_code} %{size_download}\n' "$1"; }
          echo "== HUD multifamily assisted, Montgomery and Greene"
          get 'https://services.arcgis.com/VTyQ9soqVukalItT/ArcGIS/rest/services/MULTIFAMILY_PROPERTIES_ASSISTED/FeatureServer/0/query?where=STD_ST%3D%27OH%27+AND+(CNTY_NM2+LIKE+%27Montgomery%25%27+OR+CNTY_NM2+LIKE+%27Greene%25%27)&outFields=*&f=json&resultRecordCount=2000' mf.json
          python3 -c "
          import json;d=json.load(open('mf.json'));f=[x['attributes'] for x in d.get('features',[])];print(len(f), d.get('error'))
          print(sorted(f[0].keys()) if f else '')
          for a in f[:3]: print({k:a[k] for k in a if any(t in k for t in ['NAME','PHONE','ADDR','CITY','ZIP','UNITS','ELDER','DISABL','PROGRAM','CNTY'])})"
          echo "== HUD multifamily fields"; get 'https://services.arcgis.com/VTyQ9soqVukalItT/ArcGIS/rest/services/MULTIFAMILY_PROPERTIES_ASSISTED/FeatureServer/0?f=json' mff.json; python3 -c "import json;print([x['name'] for x in json.load(open('mff.json')).get('fields',[])][:120])"
          echo "== IMLS PLS page links"; get 'https://www.imls.gov/research-evaluation/data-collection/public-libraries-survey-pls' pls.html; grep -oE 'href="[^"]*(pls|PLS)[^"]*\.(zip|csv)"' pls.html | head; get 'https://imls.gov/research-evaluation/surveys/public-libraries-survey-pls' pls2.html; grep -oE 'href="[^"]*\.(zip|csv)"' pls2.html | head
          echo "== Plentiful (pantry platform) Dayton"; get 'https://directory.plentiful.org/ohio/dayton' pl.html; grep -o '<title>[^<]*' pl.html; grep -oE '"(name|address|phone)":"[^"]{2,80}"' pl.html | head -12

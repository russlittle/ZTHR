name: ZTHR factory (manual)

# The factory runs on Google Cloud Build (cloudbuild.yaml, docs/ci-on-gcp.md).
# This workflow does not run on push, pull request or schedule. It is kept so anyone who forks the
# repository can still run the same checks on demand without a Google Cloud account.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: Gates, journeys and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run gates
      - run: npm run journeys -- --release ${{ github.sha }}

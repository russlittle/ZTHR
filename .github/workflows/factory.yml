name: ZTHR factory

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *' # nightly: mutation testing and the full battery

permissions:
  contents: read

jobs:
  gates:
    name: Gates, journeys and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Prove and run every named gate
        run: npm run gates
      - name: Run every locked journey
        run: npm run journeys -- --release ${{ github.sha }}
      - name: Mutation testing (nightly)
        if: github.event_name == 'schedule'
        run: npm run mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: |
            evidence-out/
            control/proofs.json
            reports/

  walk:
    name: Walk like a user
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Start the demonstration server
        run: |
          ADVOCATE_TODAY=2026-11-02 PORT=8787 nohup npx tsx apps/advocate/src/server/main.ts > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8787/demo > /dev/null && break; sleep 1; done
      - run: npx tsx tools/ui/walk.ts http://localhost:8787 evidence-out/ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screens
          path: evidence-out/ui

  admission:
    name: Admission (multi-family review)
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Review panel
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error title=Review panel unknown::OPENROUTER_API_KEY is not set. Every review seat is unknown, and unknown never admits a change."
            exit 1
          fi
          npx tsx tools/review.ts --base HEAD~1

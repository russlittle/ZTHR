name: Night shift

# Gauge calibration for the block library. Every block's tests are run against planted defects (mutants); each
# surviving mutant becomes a work order in intent/factory/queue/mutation for the maintenance crew, and each block's
# certificate (mutants, killed, survivors, score) is written to intent/eval/mutation. Nightly it calibrates every
# block; on a push it calibrates the blocks that changed, or every block when the gauges themselves (the mutation
# tooling or this workflow) changed; by hand it calibrates the blocks named. A final job checks
# that no block's score fell and commits the certificates and work orders back to the branch.
on:
  schedule:
    - cron: '17 4 * * *' # 04:17 UTC, clear of the 06:30-08:30 no-push window
  push:
    branches: [intent-surface]
    paths: ['intent/blocks/**', 'tools/mutation/**', '.github/workflows/night-shift.yml']
  workflow_dispatch:
    inputs:
      blocks:
        description: 'Blocks to calibrate, space-separated (empty for all)'
        required: false
        default: ''
      from_run:
        description: 'Record the certificates of an earlier run, by run id, without calibrating again'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Recording an earlier run's certificates waits for nothing; calibrations queue one behind another.
  group: night-shift-${{ github.event.inputs.from_run != '' && github.event.inputs.from_run || 'calibrate' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      blocks: ${{ steps.pick.outputs.blocks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: pick
        shell: bash
        env:
          ASKED: ${{ github.event.inputs.blocks }}
          FROM_RUN: ${{ github.event.inputs.from_run }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # A push can carry many commits: compare with where the branch stood before it, not only the last commit.
          base=HEAD~1
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base="$BEFORE"; fi
          all=$(for d in intent/blocks/*/; do b=$(basename "$d"); [ -f "$d/index.ts" ] && ls "$d"/*.test.ts >/dev/null 2>&1 && echo "$b"; done)
          if [ -n "${FROM_RUN:-}" ]; then picked=""
          elif [ -n "${ASKED:-}" ]; then picked="$ASKED"
          elif [ "$EVENT" = push ] && git diff --name-only "$base" HEAD | grep -qE '^(tools/mutation/|\.github/workflows/night-shift\.yml)'; then picked="$all"
          elif [ "$EVENT" = push ]; then picked=$(git diff --name-only "$base" HEAD -- intent/blocks | cut -d/ -f3 | sort -u | grep -Fx -f <(echo "$all") || true)
          else picked="$all"; fi
          # GitHub runs at most 256 jobs in a matrix, so the blocks go out in at most 60 shards, each run in turn.
          echo "blocks=$(printf '%s\n' $picked | jq -R . | jq -cs 'map(select(length>0)) | . as $b | ([60, length] | min) as $n | if $n == 0 then [] else [range(0; $n) as $i | [$b | to_entries[] | select(.key % $n == $i) | .value] | join(" ")] end')" >> "$GITHUB_OUTPUT"

  calibrate:
    needs: plan
    if: needs.plan.outputs.blocks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.blocks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the mutation tester (pinned)
        run: npm install --no-save --no-package-lock --prefix . @stryker-mutator/core@9.6.1 typescript@5.9.3 typescript@5.9.3
      # Every calibration is a full run. Incremental runs reuse a mutant's last verdict when its code is unchanged,
      # but with the command runner Stryker cannot see which tests changed, so a new test that kills an old survivor
      # would never be credited.
      - name: Calibrate ${{ matrix.shard }}
        env:
          MUTATION_CONCURRENCY: '4'
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          failed=0
          for b in $SHARD; do
            # Each block's certificate is handed in as soon as it is made; one block that cannot be calibrated does
            # not cost the others theirs, and the shard still fails so the block is seen.
            if timeout 45m node tools/mutation/run.ts "$b"; then cp "intent/eval/mutation/$b.json" "$RUNNER_TEMP/out/"
            else echo "::error::$b could not be calibrated"; failed=1; fi
          done
          exit "$failed"
      - id: name
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: echo "name=certificate-$(printf '%s' "$SHARD" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      # A shard the runner stops partway still hands in the certificates it finished.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          if-no-files-found: ignore
          name: ${{ steps.name.outputs.name }}
          path: ${{ runner.temp }}/out

  record:
    needs: calibrate
    if: always() && (needs.calibrate.result != 'skipped' || github.event.inputs.from_run != '')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # to commit the certificates and work orders
      actions: read # to fetch an earlier run's certificates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ github.event.inputs.from_run || github.run_id }}
          github-token: ${{ github.token }}
          pattern: certificate-*
          path: ${{ runner.temp }}/certificates
          merge-multiple: true
      - name: Install what the docs generator needs
        working-directory: intent
        run: npm ci --no-audit --no-fund
      - name: Lay the certificates on this commit
        run: cp -r "$RUNNER_TEMP/certificates/." intent/eval/mutation/
      - name: No block's score fell
        id: ratchet
        continue-on-error: true
        run: node tools/mutation/ratchet.ts
      - name: Shift summary
        shell: bash
        run: |
          {
            echo '| Block | Score | Survivors |'
            echo '|---|---|---|'
            for f in "$RUNNER_TEMP"/certificates/*.json; do
              jq -r 'select(.block) | "| \(.block) | \(.score) | \(.survived) |"' "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit certificates, work orders and the docs that read them
        shell: bash
        run: |
          set -euo pipefail
          h=$(date -u +%H%M)
          if [ "$h" -ge 0630 ] && [ "$h" -lt 0830 ]; then echo "Inside the 06:30-08:30 UTC no-push window; results are in the artefacts."; exit 0; fi
          git config user.name 'zthr-night-shift'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Generated files are never rebased: each attempt starts from the branch as it is now, lays the
          # certificates on it, and regenerates the work orders and docs from scratch.
          for attempt in 1 2 3 4; do
            git fetch -q origin intent-surface
            git checkout -q -B shift FETCH_HEAD
            cp -r "$RUNNER_TEMP/certificates/." intent/eval/mutation/
            blocks=$(ls "$RUNNER_TEMP"/certificates/*.json | xargs -n1 basename | sed 's/\.json$//')
            node tools/mutation/tasks.ts $blocks
            (cd intent && node tools/docs.ts --write >/dev/null && node tools/docs.ts --write >/dev/null && node tools/docs.ts --check)
            git add intent/eval/mutation intent/factory/queue/mutation intent/docs intent/blocks/README.md intent/papers docs
            if git diff --cached --quiet; then echo 'Nothing changed.'; exit 0; fi
            git commit -q -m "Night shift: gauge certificates and work orders (${{ github.event_name }})"
            if git push -q origin HEAD:intent-surface; then exit 0; fi
            echo "The branch moved during attempt $attempt; starting again from its new head."
            sleep $((attempt * 10))
          done
          exit 1
      - name: Fail the shift if a score fell
        if: steps.ratchet.outcome == 'failure'
        run: exit 1

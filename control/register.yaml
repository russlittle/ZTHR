# Register, don't suppress (Pattern 13). Every finding we have not fixed yet: what it is, why it is accepted for
# now, who owns it, and when the acceptance expires. An expired entry fails the findings-register gate.
findings:
  - id: review-panel-not-configured
    gate: multi-family-review
    finding: The multi-family review panel (control/review.yaml) has no model provider configured in this build, so admission rests on the deterministic gates and journeys.
    reason: Model review is optional for adopters; the pipeline reports it as not measured rather than passed.
    owner: claude-agent
    expires: 2027-02-01
  - id: spanish-partial
    gate: journeys
    finding: Spanish covers text onboarding, finding help and crisis replies; other screens answer in English.
    reason: Phase 2 slice; the remaining screens are scheduled with a walk invariant that fails on any English sentence to a Spanish student.
    owner: claude-agent
    expires: 2027-01-15
  - id: persistence-not-measured
    gate: outcomes
    finding: Persistence and credits are not measured.
    reason: They need a college's records for students who opt in (Phase 4 pilot); they are never estimated from app activity.
    owner: claude-agent
    expires: 2027-06-01
  - id: blocks-below-mutation-target
    gate: block-library
    finding: Six blocks score under the 80% mutation target on their own tests (runtime, ui, evidence, explore, gates, intent); their floors are set at today's scores and only rise.
    reason: These blocks were first tested through the app; their own suites are being grown block by block, guided by surviving mutants.
    owner: claude-agent
    expires: 2027-01-15
  - id: zod-major-upgrade
    gate: dependencies
    finding: The schema library (zod 3) has a high-severity advisory, memory exhaustion while validating oversized constrained collections; the fix is zod 4, a breaking change.
    reason: Every untrusted input is capped at 256 KB before validation, which bounds the attack; the upgrade is scheduled with its own walk.
    owner: claude-agent
    expires: 2026-12-15
  - id: vitest-dev-advisories
    gate: dependencies
    finding: The test runner (vitest 3, and tinypool under it) has critical advisories, path traversal in its mocker and prototype pollution in worker options; the fix is vitest 5, a breaking change.
    reason: Development only; nothing from it ships in the application image, and it runs only on trusted code in CI. The upgrade is scheduled with a full test and mutation run.
    owner: claude-agent
    expires: 2026-12-15
  - id: screen-readers-not-tested-by-people
    gate: ui-walk
    finding: Accessibility is checked automatically on every build (every WCAG 2.2 A and AA rule axe tests, the accessibility tree, focus, text spacing, reflow and contrast); it has not yet been tested with NVDA, JAWS, VoiceOver and TalkBack by people who use them.
    reason: Automated checks cover what a machine can decide; testing with screen reader users needs people, and is the next step.
    owner: claude-agent
    expires: 2027-02-01
  - id: sinclair-term-dates-unknown
    gate: journeys
    finding: Sinclair's Fall 2026 term dates were not available from a public source, so Sinclair students see drop and withdrawal dates as not known and are sent to the registration calendar.
    reason: The app never guesses a date; the dates go into control/colleges/sinclair.yaml when the calendar can be read.
    owner: claude-agent
    expires: 2027-01-15

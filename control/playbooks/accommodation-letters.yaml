playbook: accommodation-letters
title: Your letters each term
purpose: Get approved accommodation letters to every instructor at the start of each term, without the student having to repeat the conversation.
owner: builder
admitted_by: factory
sources:
  - https://www2.ed.gov/about/offices/list/ocr/transition.html
student_grants:
  sealed: [disability_accommodations]
  profile: [chosenName, college]
journeys: [persona-8c-accommodation-letters]
steps:
  - id: request-letters
    kind: checklist
    text: Ask your college's disability office for this term's letters. Most offices send them to your teachers once you ask.
    done_when: student-confirms
  - id: list-courses
    kind: info
    text: I made a list of your classes for this term, so none get missed.
  - id: note-to-office
    kind: draft
    requires_approval: true
    to: disability services office
    text: "Hello, this is {chosenName}. Please send my accommodation letters for this term to my instructors. Thank you."
  - id: confirm-received
    kind: wait
    text: I'll check back in a week to make sure each teacher got your letter.
    timeout_days: 10
    on_timeout: One or more letters may not have gone out. I can draft a short follow-up.
recovery:
  - If an instructor did not get a letter, I can draft a short, private note asking the office to resend it.

# ZTHR factory on Google Cloud Build.
#
# This is where the tests run. GitHub hosts the code; its workflow is manual-only.
# Every run records its own compute cost (tools/ci-cost.ts) and the evidence page publishes it.
#
# Substitutions:
#   _MUTATION        "true" on the nightly trigger to run mutation testing; "false" otherwise.
#   _KIND            "nightly" on the nightly trigger; "push" otherwise. Labels the cost record.
#   _EVIDENCE_BUCKET gs:// bucket that keeps each run's evidence and one cost record per run (costs/<build>.json).
#                    The cost clock stops at the record-cost step; the evidence page and upload after it are not counted.
#                    Without it, the cost history holds only the current run.
#
# Setup: docs/testing/ci.md

substitutions:
  _DEPLOY_BRANCH: 'reference-implementation'  # the only branch that deploys; every other branch stops after the evidence
  _MUTATION: 'false'
  _KIND: 'push'
  _EVIDENCE_BUCKET: ''

options:
  # Keep CI_MACHINE in the cost step equal to this, and its rate in control/ci-rates.json.
  machineType: E2_HIGHCPU_8
  substitution_option: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY

# Pushes take minutes (spot checks); the nightly run walks every student to a fixpoint and needs hours.
timeout: 21600s

steps:
  - id: start
    # Start the cost clock, and make sure full git history is present for the evidence page.
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    env: ['COMMIT=$COMMIT_SHA']
    args:
      - -c
      - |
        date +%s > .ci-start
        if [ ! -d .git ]; then
          git init -q && git remote add origin https://github.com/russlittle/ZTHR.git
          git fetch -q origin "$$COMMIT" && git reset -q --soft FETCH_HEAD
        elif [ -f .git/shallow ]; then
          git fetch -q --unshallow || true
        fi

  - id: install
    name: node:22-bookworm
    entrypoint: npm
    args: ['ci']

  - id: typecheck
    name: node:22-bookworm
    entrypoint: npm
    args: ['run', 'typecheck']

  - id: test
    name: node:22-bookworm
    entrypoint: bash
    # Generated-input tests run 200 cases on every change and 2,000 on the nightly run.
    env: ['MUTATION=$_MUTATION']
    args: ['-c', 'if [ "$$MUTATION" = "true" ]; then export FUZZ_RUNS=2000; fi; npm test']

  - id: gates
    name: node:22-bookworm
    entrypoint: npm
    args: ['run', 'gates']

  - id: journeys
    name: node:22-bookworm
    entrypoint: bash
    env: ['COMMIT=$COMMIT_SHA']
    args: ['-c', 'npm run journeys -- --release "$${COMMIT:-manual}"']

  - id: docs
    # Docs derived from the system are current, and every test and doc is linked both ways.
    name: node:22-bookworm
    entrypoint: npm
    args: ['run', 'docs:check']

  - id: contract
    # Every campus service answers its 21 contract probes and matches its recorded fixtures (Pattern 33).
    name: node:22-bookworm
    entrypoint: npm
    args: ['run', 'contract']

  - id: fetch-walks
    # Every student's last full walk and the lines it executed, so this build can tell which walks still hold.
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env: ['BUCKET=$_EVIDENCE_BUCKET']
    args: ['-c', 'mkdir -p evidence-out/last; if [ -n "$$BUCKET" ]; then for w in explore crawl; do gcloud storage cp -r "$$BUCKET/latest/walks/$$w" evidence-out/last/ 2>/dev/null || echo "No saved $$w walks yet."; done; fi']

  - id: explore
    # The button walk, one process per CPU. Nightly: a rotation of four students walked to a fixpoint under coverage
    # (those whose saved walks no longer hold, then the oldest); a phase certifies once all twelve have a full walk that
    # still holds for this commit. A push: carry the saved walks forward if all still hold, otherwise spot-check four
    # students whose settings differ most, bounded at 150 states per seed, failing on any violation.
    name: node:22-bookworm
    entrypoint: bash
    env: ['FULL=$_MUTATION']
    args: ['-c', 'tools/walk-ci.sh explore "$$FULL"']

  - id: crawl
    # The feature walk: every page, link and form, on the same rotation; then every combination of settings.
    name: node:22-bookworm
    entrypoint: bash
    env: ['FULL=$_MUTATION']
    args: ['-c', 'tools/walk-ci.sh crawl "$$FULL" && if [ "$$FULL" = "true" ]; then npx tsx tools/crawl.ts --settings; else npx tsx tools/crawl.ts Maria --settings; fi']

  - id: walk
    # Walk like a user in a real browser: intents with video, then every screen at two widths in two themes.
    name: node:22-bookworm
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        npm install --no-save playwright@1.63.0
        npx playwright install --with-deps chromium
        npx tsx tools/site.ts
        ADVOCATE_TODAY=2026-11-02 ADVOCATE_CLOCK=07:30 PORT=8787 ADVOCATE_BASE=/studentadvocate ADVOCATE_RATE_PER_MIN=100000 ADVOCATE_SANDBOX_STARTS_PER_HOUR=100000 npx tsx apps/advocate/src/server/main.ts > server.log 2>&1 &
        for i in $$(seq 1 30); do curl -sf localhost:8787/studentadvocate/ > /dev/null && break; sleep 1; done
        npx tsx tools/ui/walk.ts http://localhost:8787/studentadvocate evidence-out/ui || { cat server.log; exit 1; }
        # Every link and button, clicked, then every one on the screen it leads to, down to depth 8, for five students.
        npx tsx tools/ui/deep.ts http://localhost:8787/studentadvocate evidence-out/deep || { cat server.log; exit 1; }
        # Many visitors at once against the same server: fails on any 500 or a 95th percentile over budget.
        npx tsx tools/load.ts http://localhost:8787/studentadvocate 25 30 || { cat server.log; exit 1; }

  - id: mutation
    name: node:22-bookworm
    entrypoint: bash
    env: ['MUTATION=$_MUTATION']
    args: ['-c', 'if [ "$$MUTATION" = "true" ]; then npx stryker run --concurrency "$$(nproc)" && npx tsx tools/blocks.ts --mutate; else echo "Mutation testing runs on the nightly trigger."; fi']

  - id: sensitive-trace
    # Plants a marker in every personal, sensitive and secret field and records where each one went.
    name: node:22-bookworm
    entrypoint: npx
    args: ['tsx', 'tools/sensitive.ts']

  - id: fetch-cost-history
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env: ['BUCKET=$_EVIDENCE_BUCKET']
    args: ['-c', 'mkdir -p evidence-out reports; if [ -n "$$BUCKET" ]; then gcloud storage cat "$$BUCKET/costs/*.json" > evidence-out/ci-costs.jsonl 2>/dev/null || { : > evidence-out/ci-costs.jsonl; echo "No cost history yet."; }; [ -f reports/mutation.json ] || gcloud storage cp "$$BUCKET/latest/mutation.json" reports/mutation.json 2>/dev/null || echo "No nightly mutation report yet."; [ -d reports/blocks ] || gcloud storage cp -r "$$BUCKET/latest/blocks" reports/ 2>/dev/null || echo "No nightly block reports yet."; fi']

  - id: blocks
    # The block library: tests, consumers and each block's own mutation score (from the nightly run when this is not one).
    name: node:22-bookworm
    entrypoint: npx
    args: ['tsx', 'tools/blocks.ts']

  - id: record-cost
    name: node:22-bookworm
    entrypoint: npx
    env: ['CI_MACHINE=E2_HIGHCPU_8', 'CI_KIND=$_KIND', 'BUILD_ID=$BUILD_ID', 'COMMIT=$COMMIT_SHA']
    args: ['tsx', 'tools/ci-cost.ts']

  - id: certify-phase
    # Phase certificates for this commit: every gate, journey, walk, contract and mutation result from this build.
    # A report from another commit, or a walk of fewer than twelve students, is "not measured", never a pass.
    name: node:22-bookworm
    entrypoint: npm
    args: ['run', 'certify-phase']

  - id: evidence-page
    name: node:22-bookworm
    entrypoint: npm
    args: ['run', 'evidence']

  - id: keep-evidence
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env: ['BUCKET=$_EVIDENCE_BUCKET', 'COMMIT=$COMMIT_SHA', 'BUILD=$BUILD_ID', 'BRANCH=$BRANCH_NAME', 'DEPLOY=$_DEPLOY_BRANCH']
    args:
      - -c
      - |
        if [ -z "$$BUCKET" ]; then echo "No evidence bucket set; skipping upload."; exit 0; fi
        gcloud storage cp evidence-out/ci-cost.json "$$BUCKET/costs/$${BUILD:-manual-$$(date +%s)}.json"
        gcloud storage cp -r evidence-out control/proofs.json "$$BUCKET/runs/$${COMMIT:-manual}/"
        if [ -d reports ]; then gcloud storage cp -r reports "$$BUCKET/runs/$${COMMIT:-manual}/"; fi
        if [ "$_MUTATION" = "true" ] && [ "$$BRANCH" = "$$DEPLOY" ] && [ -d evidence-out/walks ]; then gcloud storage cp -r evidence-out/walks/* "$$BUCKET/latest/walks/"; fi
        if [ -f reports/mutation.json ] && [ "$_MUTATION" = "true" ]; then gcloud storage cp reports/mutation.json "$$BUCKET/latest/mutation.json"; gcloud storage cp -r reports/blocks "$$BUCKET/latest/"; fi

  - id: site
    # The published docs and factory console, from everything this run recorded.
    name: node:22-bookworm
    entrypoint: npx
    args: ['tsx', 'tools/site.ts']

  - id: image
    # Only the main line of the reference implementation is deployed; other branches stop after the evidence.
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env: ['BRANCH=$BRANCH_NAME', 'PROJECT=$PROJECT_ID', 'COMMIT=$COMMIT_SHA', 'DEPLOY=$_DEPLOY_BRANCH']
    args:
      - -c
      - |
        if [ "$$BRANCH" != "$$DEPLOY" ]; then echo "Not deploying $$BRANCH."; exit 0; fi
        docker build -t "us-central1-docker.pkg.dev/$$PROJECT/zthr/advocate:$$COMMIT" .
        docker push "us-central1-docker.pkg.dev/$$PROJECT/zthr/advocate:$$COMMIT"

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env: ['BRANCH=$BRANCH_NAME', 'PROJECT=$PROJECT_ID', 'COMMIT=$COMMIT_SHA', 'DEPLOY=$_DEPLOY_BRANCH']
    args:
      - -c
      - |
        # The reference branch always deploys, whatever a trigger's substitutions say; any other branch stops here, and says so.
        echo "branch '$$BRANCH', deploy branch '$$DEPLOY'"
        if [ "$$BRANCH" != "reference-implementation" ] && [ "$$BRANCH" != "$$DEPLOY" ]; then echo "Not deploying $$BRANCH."; exit 0; fi
        # Each visitor's demo copy lives in one server's memory, so the demo runs on one server, and a visitor's
        # requests stay with it: a second server would not have their copy and the session would reset mid-way.
        gcloud run deploy advocate --project "$$PROJECT" --region us-central1 \
          --image "us-central1-docker.pkg.dev/$$PROJECT/zthr/advocate:$$COMMIT" \
          --service-account "zthr-advocate@$$PROJECT.iam.gserviceaccount.com" \
          --allow-unauthenticated --memory 1Gi --cpu 1 --min-instances 1 --max-instances 1 --concurrency 80 --session-affinity \
          --labels "commit=$${COMMIT:0:12}" --set-env-vars "BUILD_COMMIT=$$COMMIT" --quiet
        # A revision pinned by hand would keep traffic away from the new one; the commit that passed takes all of it.
        gcloud run services update-traffic advocate --project "$$PROJECT" --region us-central1 --to-latest --quiet

  - id: verify-serving
    # Done means serving (Pattern 23): what answers on the public URL is the commit that passed, or the build fails.
    # Cloud Run reserves paths ending in "z" (such as /healthz), so the app reports its commit at /studentadvocate/version.
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env: ['BRANCH=$BRANCH_NAME', 'PROJECT=$PROJECT_ID', 'COMMIT=$COMMIT_SHA', 'DEPLOY=$_DEPLOY_BRANCH']
    args:
      - -c
      - |
        if [ "$$BRANCH" != "reference-implementation" ] && [ "$$BRANCH" != "$$DEPLOY" ]; then echo "Not deploying $$BRANCH."; exit 0; fi
        url=$$(gcloud run services describe advocate --project "$$PROJECT" --region us-central1 --format 'value(status.url)')
        for i in 1 2 3 4 5 6; do
          got=$$(curl -fsS "$$url/studentadvocate/version" | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p')
          [ "$$got" = "$$COMMIT" ] && { echo "serving $$got"; exit 0; }
          sleep 10
        done
        echo "serving '$$got', expected $$COMMIT"; exit 1

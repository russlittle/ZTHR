# ZTHR factory on Google Cloud Build.
#
# This is where the tests run. GitHub hosts the code; its workflow is manual-only.
# Every run records its own compute cost (tools/ci-cost.ts) and the evidence page publishes it.
#
# Substitutions:
#   _MUTATION        "true" on the nightly trigger to run mutation testing; "false" otherwise.
#   _KIND            "nightly" on the nightly trigger; "push" otherwise. Labels the cost record.
#   _EVIDENCE_BUCKET gs:// bucket that keeps each run's evidence and one cost record per run (costs/<build>.json).
#                    The cost clock stops at the record-cost step; the evidence page and upload after it are not counted.
#                    Without it, the cost history holds only the current run.
#
# Setup: docs/testing/ci.md

substitutions:
  _DEPLOY_BRANCH: ''  # set on the trigger by tools/setup-deploy.sh once deploying is allowed
  _MUTATION: 'false'
  _KIND: 'push'
  _EVIDENCE_BUCKET: ''

options:
  # Keep CI_MACHINE in the cost step equal to this, and its rate in control/ci-rates.json.
  machineType: E2_HIGHCPU_8
  substitution_option: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s

steps:
  - id: start
    # Start the cost clock, and make sure full git history is present for the evidence page.
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    env: ['COMMIT=$COMMIT_SHA']
    args:
      - -c
      - |
        date +%s > .ci-start
        if [ ! -d .git ]; then
          git init -q && git remote add origin https://github.com/russlittle/ZTHR.git
          git fetch -q origin "$$COMMIT" && git reset -q --soft FETCH_HEAD
        elif [ -f .git/shallow ]; then
          git fetch -q --unshallow || true
        fi

  - id: install
    name: node:22-bookworm
    entrypoint: npm
    args: ['ci']

  - id: typecheck
    name: node:22-bookworm
    entrypoint: npm
    args: ['run', 'typecheck']

  - id: test
    name: node:22-bookworm
    entrypoint: npm
    args: ['test']

  - id: gates
    name: node:22-bookworm
    entrypoint: npm
    args: ['run', 'gates']

  - id: journeys
    name: node:22-bookworm
    entrypoint: bash
    env: ['COMMIT=$COMMIT_SHA']
    args: ['-c', 'npm run journeys -- --release "$${COMMIT:-manual}"']

  - id: docs
    # Docs derived from the system are current, and every test and doc is linked both ways.
    name: node:22-bookworm
    entrypoint: npm
    args: ['run', 'docs:check']

  - id: contract
    # Every campus service answers its 21 contract probes and matches its recorded fixtures (Pattern 33).
    name: node:22-bookworm
    entrypoint: npm
    args: ['run', 'contract']

  - id: explore
    # The button walk: every depth, app and text, to a fixpoint, one process per CPU. Nightly walks all twelve
    # students; a push walks four whose settings differ most (standard, brief, walk-me-through at grade 6, out of area).
    name: node:22-bookworm
    entrypoint: bash
    env: ['FULL=$_MUTATION']
    args: ['-c', 'if [ "$$FULL" = "true" ]; then npm run explore; else npm run explore -- Maria,Ana,Sam,Keisha; fi']

  - id: crawl
    # The feature walk: every page, link and form, then every combination of settings. Same split as above.
    name: node:22-bookworm
    entrypoint: bash
    env: ['FULL=$_MUTATION']
    args: ['-c', 'if [ "$$FULL" = "true" ]; then npm run crawl && npm run crawl -- --settings; else npm run crawl -- Maria,Ana,Sam,Keisha && npm run crawl -- Maria --settings; fi']

  - id: walk
    # Walk like a user in a real browser: intents with video, then every screen at two widths in two themes.
    name: node:22-bookworm
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        npm install --no-save playwright@1.63.0
        npx playwright install --with-deps chromium
        npx tsx tools/site.ts
        ADVOCATE_TODAY=2026-11-02 PORT=8787 ADVOCATE_BASE=/advocate npx tsx apps/advocate/src/server/main.ts > server.log 2>&1 &
        for i in $$(seq 1 30); do curl -sf localhost:8787/advocate/ > /dev/null && break; sleep 1; done
        npx tsx tools/ui/walk.ts http://localhost:8787/advocate evidence-out/ui || { cat server.log; exit 1; }

  - id: mutation
    name: node:22-bookworm
    entrypoint: bash
    env: ['MUTATION=$_MUTATION']
    args: ['-c', 'if [ "$$MUTATION" = "true" ]; then npx stryker run --concurrency "$$(nproc)"; else echo "Mutation testing runs on the nightly trigger."; fi']

  - id: fetch-cost-history
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env: ['BUCKET=$_EVIDENCE_BUCKET']
    args: ['-c', 'mkdir -p evidence-out reports; if [ -n "$$BUCKET" ]; then gcloud storage cat "$$BUCKET/costs/*.json" > evidence-out/ci-costs.jsonl 2>/dev/null || { : > evidence-out/ci-costs.jsonl; echo "No cost history yet."; }; [ -f reports/mutation.json ] || gcloud storage cp "$$BUCKET/latest/mutation.json" reports/mutation.json 2>/dev/null || echo "No nightly mutation report yet."; fi']

  - id: record-cost
    name: node:22-bookworm
    entrypoint: npx
    env: ['CI_MACHINE=E2_HIGHCPU_8', 'CI_KIND=$_KIND', 'BUILD_ID=$BUILD_ID', 'COMMIT=$COMMIT_SHA']
    args: ['tsx', 'tools/ci-cost.ts']

  - id: evidence-page
    name: node:22-bookworm
    entrypoint: npm
    args: ['run', 'evidence']

  - id: keep-evidence
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env: ['BUCKET=$_EVIDENCE_BUCKET', 'COMMIT=$COMMIT_SHA', 'BUILD=$BUILD_ID']
    args:
      - -c
      - |
        if [ -z "$$BUCKET" ]; then echo "No evidence bucket set; skipping upload."; exit 0; fi
        gcloud storage cp evidence-out/ci-cost.json "$$BUCKET/costs/$${BUILD:-manual-$$(date +%s)}.json"
        gcloud storage cp -r evidence-out control/proofs.json "$$BUCKET/runs/$${COMMIT:-manual}/"
        if [ -d reports ]; then gcloud storage cp -r reports "$$BUCKET/runs/$${COMMIT:-manual}/"; fi
        if [ -f reports/mutation.json ] && [ "$_MUTATION" = "true" ]; then gcloud storage cp reports/mutation.json "$$BUCKET/latest/mutation.json"; fi

  - id: site
    # The published docs and factory console, from everything this run recorded.
    name: node:22-bookworm
    entrypoint: npx
    args: ['tsx', 'tools/site.ts']

  - id: image
    # Only the main line of the reference implementation is deployed; other branches stop after the evidence.
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env: ['BRANCH=$BRANCH_NAME', 'PROJECT=$PROJECT_ID', 'COMMIT=$COMMIT_SHA', 'DEPLOY=$_DEPLOY_BRANCH']
    args:
      - -c
      - |
        if [ "$$BRANCH" != "$$DEPLOY" ]; then echo "Not deploying $$BRANCH."; exit 0; fi
        docker build -t "us-central1-docker.pkg.dev/$$PROJECT/zthr/advocate:$$COMMIT" .
        docker push "us-central1-docker.pkg.dev/$$PROJECT/zthr/advocate:$$COMMIT"

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env: ['BRANCH=$BRANCH_NAME', 'PROJECT=$PROJECT_ID', 'COMMIT=$COMMIT_SHA', 'DEPLOY=$_DEPLOY_BRANCH']
    args:
      - -c
      - |
        if [ "$$BRANCH" != "$$DEPLOY" ]; then echo "Not deploying $$BRANCH."; exit 0; fi
        gcloud run deploy advocate --project "$$PROJECT" --region us-central1 \
          --image "us-central1-docker.pkg.dev/$$PROJECT/zthr/advocate:$$COMMIT" \
          --service-account "zthr-advocate@$$PROJECT.iam.gserviceaccount.com" \
          --allow-unauthenticated --memory 1Gi --cpu 1 --min-instances 0 --max-instances 2 --concurrency 40 \
          --labels "commit=$${COMMIT:0:12}" --set-env-vars "BUILD_COMMIT=$$COMMIT" --quiet

  - id: verify-serving
    # Done means serving (Pattern 23): what answers on the public URL is the commit that passed, or the build fails.
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env: ['BRANCH=$BRANCH_NAME', 'PROJECT=$PROJECT_ID', 'COMMIT=$COMMIT_SHA', 'DEPLOY=$_DEPLOY_BRANCH']
    args:
      - -c
      - |
        if [ "$$BRANCH" != "$$DEPLOY" ]; then echo "Not deploying $$BRANCH."; exit 0; fi
        url=$$(gcloud run services describe advocate --project "$$PROJECT" --region us-central1 --format 'value(status.url)')
        for i in 1 2 3 4 5 6; do
          got=$$(curl -fsS "$$url/healthz" | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p')
          [ "$$got" = "$$COMMIT" ] && { echo "serving $$got"; exit 0; }
          sleep 10
        done
        echo "serving '$$got', expected $$COMMIT"; exit 1
